[package]
name = "contura-core"
version = "1.0.0"
license = "MIT"
edition = "2024"

[lib]
name = "contura_core"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }
keyring = "4.2"
rust-ini = "0.21"
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "default-rustls-ring"] }
base64 = "0.22"
tokio-postgres = "0.7"
futures-util = { version = "0.3", default-features = false }
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
csv = "1"
sha2 = "0.10"
rust_xlsxwriter = { version = "0.100", features = ["constant_memory"] }
calamine = "0.36"
same-file = "1"
# Deleting a diagram moves its files to the Recycle Bin.
trash = "5"
# Inflates one packed icon at a time (step 6+); already in the tree through zip.
flate2 = "1"
# Checks a link before Contura opens it in the system browser; already in the tree.
url = "2"
# The zip calamine reads with, for the unpacked-size check before it opens a workbook.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# Secret shapes the AI input rail redacts; already in the tree.
regex = "1"
# The one HTTP client for AI providers (ai/provider/http.rs); TLS is rustls with ring and
# the OS certificate store, so no aws-lc-rs enters the tree.
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "rustls-no-provider", "system-proxy"] }
rustls-platform-verifier = "0.7"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[features]
# Helpers for tests outside this crate's unit tests, such as short pass lifetimes.
test-util = []

[dev-dependencies]
tempfile = "3"
# The mock HTTP server in tests/support/mock_http.rs.
tokio = { version = "1", features = ["net", "io-util"] }
contura-core = { path = ".", features = ["test-util"] }
