name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Two workers keep jsdom under the runner's memory.
      - run: npx vitest run --maxWorkers=2

  rust:
    name: Rust (fmt, clippy, core tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      # The suites read these (tests/common); the names predate the rename.
      DBVIEW_TEST_MYSQL_HOST: 127.0.0.1
      DBVIEW_TEST_MYSQL_PORT: 3306
      DBVIEW_TEST_MYSQL_USER: dbview_test
      DBVIEW_TEST_MYSQL_PASSWORD: dbview_test
      DBVIEW_TEST_PG_HOST: 127.0.0.1
      DBVIEW_TEST_PG_PORT: 5432
      DBVIEW_TEST_PG_USER: dbview_test
      DBVIEW_TEST_PG_PASSWORD: dbview_test
      # About 60 test binaries: without debug info they fit the runner's disk.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test users
        # Tests create and drop their own databases. The Postgres user is not a superuser,
        # so REVOKE tests see real grants; MySQL needs function creation with binary logs on.
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE USER 'dbview_test'@'%' IDENTIFIED BY 'dbview_test';
            GRANT ALL PRIVILEGES ON *.* TO 'dbview_test'@'%' WITH GRANT OPTION;
            SET PERSIST log_bin_trust_function_creators = 1;"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c \
            "CREATE ROLE dbview_test LOGIN CREATEDB CREATEROLE PASSWORD 'dbview_test';"
      - run: cargo fmt --all -- --check
      - run: cargo clippy -j 4 --workspace --all-targets --features contura-core/test-util -- -D warnings
      - run: cargo test -j 4 -p contura-core --no-fail-fast
